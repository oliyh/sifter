name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: sifter-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Rolling "latest" release so the jar has a stable, login-free download link.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Automated build of commit $GITHUB_SHA"
