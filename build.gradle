plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add extra maven repos here if a dependency ever needs one.
}

loom {
	// Splits code into "src/main" (runs everywhere) and "src/client" (runs only
	// on the player's screen - rendering, models, etc). We'll use src/client
	// once the sifter needs custom visuals.
	splitEnvironmentSourceSets()

	mods {
		"sifter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API - the toolkit of helper code for registering entities,
	// items, trades, etc. Almost every Fabric mod depends on this.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit - lets us write automated tests (src/test/java) for the parts
	// of our code that don't need a running Minecraft game to check.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Copies the built mod jar into the Windows mods folder, reached through
// the VMware shared-folder mount at /mnt/hgfs/mods. Runs automatically
// after every "./gradlew build". If the mount isn't there (VMware shared
// folders not set up, or not mounted yet), this just skips itself with a
// warning instead of failing the whole build.
def windowsModsDir = file('/mnt/hgfs/mods')

tasks.register('copyToMinecraft', Copy) {
	group = 'sifter'
	description = 'Copies the built mod jar into the Windows mods folder.'
	dependsOn remapJar
	from remapJar.archiveFile
	into windowsModsDir
	onlyIf {
		def exists = windowsModsDir.exists()
		if (!exists) {
			logger.warn("copyToMinecraft: ${windowsModsDir} not found - is the shared folder mounted? Skipping copy.")
		}
		return exists
	}
}

build.finalizedBy(tasks.named('copyToMinecraft'))

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
